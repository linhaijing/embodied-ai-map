<title>具身智能信息源地图 · 系统学习导航</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --card2:#1d212b; --line:#2a2f3a;
    --txt:#e6e9ef; --sub:#9aa4b2; --accent:#4f9cf9; --accent2:#2ee6a6;
    --star:#ffce54; --tag:#242a36; --side:#12151c;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;
    background:var(--bg);color:var(--txt);line-height:1.6;height:100vh;overflow:hidden;}
  .layout{display:flex;height:100vh;}
  /* 侧边栏 */
  aside{width:288px;flex:0 0 288px;background:var(--side);border-right:1px solid var(--line);
    display:flex;flex-direction:column;height:100vh;}
  .brand{padding:18px 18px 10px;}
  .brand h1{font-size:18px;margin:0 0 4px;}
  .brand .sub{color:var(--sub);font-size:12px;}
  .side-search{padding:4px 14px 10px;}
  .side-search input{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);
    background:var(--card);color:var(--txt);font-size:13px;outline:none;}
  .side-search input:focus{border-color:var(--accent);}
  .menu{flex:1;overflow-y:auto;padding:4px 10px 18px;}
  .grp{margin-bottom:4px;}
  .grp>.ghead{display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:9px 12px;border-radius:9px;color:var(--txt);font-size:14px;font-weight:600;cursor:pointer;user-select:none;}
  .grp>.ghead:hover{background:var(--card);}
  .grp>.ghead .arw{color:var(--sub);font-size:11px;transition:transform .15s;}
  .grp.open>.ghead .arw{transform:rotate(90deg);}
  .subs{overflow:hidden;max-height:0;transition:max-height .2s ease;}
  .grp.open .subs{max-height:900px;}
  .subs a{display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:7px 12px 7px 26px;border-radius:8px;color:var(--sub);font-size:13px;text-decoration:none;cursor:pointer;margin:1px 0;}
  .subs a .cnt{font-size:10.5px;color:#6b7482;background:var(--tag);border-radius:999px;padding:1px 7px;}
  .subs a:hover{color:var(--txt);background:var(--card);}
  .subs a.active{color:#fff;background:var(--accent);}
  .subs a.active .cnt{color:#fff;background:rgba(255,255,255,.2);}
  /* 右侧内容 */
  main{flex:1;height:100vh;overflow-y:auto;padding:22px 24px 48px;}
  .crumb{color:var(--sub);font-size:12px;margin-bottom:6px;}
  .crumb b{color:var(--accent);font-weight:600;}
  .sec-head{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;border-bottom:1px solid var(--line);padding-bottom:9px;}
  .sec-head h2{font-size:20px;margin:0;}
  .sec-head .cnt{color:var(--sub);font-size:13px;}
  .sec-head .tip{margin-left:auto;color:var(--sub);font-size:12px;}
  .lead{color:var(--sub);font-size:13px;margin:-4px 0 14px;}
  .grid{column-gap:14px;column-width:330px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 12px;transition:.15s;
    break-inside:avoid;margin:0 0 9px;display:flex;flex-direction:column;}
  .card:hover{border-color:var(--accent);background:var(--card2);}
  .card a.name{font-size:14px;font-weight:600;color:var(--txt);text-decoration:none;}
  .card a.name:hover{color:var(--accent);}
  .card .star{color:var(--star);margin-right:3px;}
  .card .desc{color:var(--sub);font-size:12px;margin:3px 0 6px;line-height:1.45;}
  .card .links{display:flex;flex-wrap:wrap;gap:5px;}
  .card .links a{font-size:11.5px;color:var(--accent);text-decoration:none;background:var(--tag);
    padding:2px 8px;border-radius:6px;border:1px solid var(--line);}
  .card .links a:hover{background:#2b3240;}
  .hint{background:var(--card2);border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--sub);font-size:13px;margin-bottom:12px;}
  .hint h3{color:var(--txt);margin:0 0 8px;font-size:15px;}
  .hint ol,.hint ul{margin:6px 0 0;padding-left:20px;}
  .hint li{margin:3px 0;}
  .hint b{color:var(--txt);}
  .path{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
  .step{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
  .step .n{display:inline-block;background:var(--accent);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:1px 10px;margin-bottom:8px;}
  .step h4{margin:0 0 6px;font-size:15px;}
  .step p{margin:0;color:var(--sub);font-size:12.5px;}
  .step .go{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px;}
  .step .go a{font-size:11.5px;color:var(--accent);text-decoration:none;background:var(--tag);padding:2px 8px;border-radius:6px;border:1px solid var(--line);cursor:pointer;}
  .foot{margin-top:28px;color:var(--sub);font-size:12px;border-top:1px solid var(--line);padding-top:14px;}
  .hidden{display:none !important;}
  /* 移动端顶部条 + 抽屉遮罩（桌面隐藏） */
  .mtop{display:none;}
  .overlay{display:none;}
  @media(max-width:760px){
    /* 顶部条：汉堡 + 标题 */
    .mtop{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:40;
      background:var(--side);border-bottom:1px solid var(--line);padding:10px 14px;}
    .mtop .burger{width:40px;height:40px;flex:0 0 40px;border:1px solid var(--line);background:var(--card);
      border-radius:10px;color:var(--txt);font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;}
    .mtop .mtitle{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    /* 整体回到普通文档流滚动 */
    body{overflow:auto;height:auto;}
    .layout{display:block;height:auto;}
    /* 抽屉式侧边栏：默认移出屏幕 */
    aside{position:fixed;top:0;left:0;z-index:60;width:84%;max-width:320px;height:100vh;
      flex:none;border-right:1px solid var(--line);
      transform:translateX(-100%);transition:transform .22s ease;box-shadow:2px 0 18px rgba(0,0,0,.4);}
    body.drawer-open aside{transform:translateX(0);}
    .overlay{display:block;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);
      opacity:0;pointer-events:none;transition:opacity .22s ease;}
    body.drawer-open .overlay{opacity:1;pointer-events:auto;}
    .menu{flex:1;max-height:none;}
    /* 内容区铺满、单列卡片、加大触控区 */
    main{height:auto;padding:14px 14px 48px;}
    .grid{column-width:auto;column-count:1;}
    .sec-head h2{font-size:18px;}
    .card{padding:11px 13px;}
    .card a.name{font-size:15px;}
    .card .desc{font-size:13px;}
    .card .links a,.step .go a{font-size:13px;padding:6px 11px;}
    .path{grid-template-columns:1fr;}
    .hint{padding:14px;}
  }
</style>

/* ---- 运行时 ---- */
const content = document.getElementById('content');
const menuBox = document.getElementById('menu');
/* 移动端抽屉开关 */
const burger = document.getElementById('burger');
const overlay = document.getElementById('overlay');
function openDrawer(){ document.body.classList.add('drawer-open'); }
function closeDrawer(){ document.body.classList.remove('drawer-open'); }
function toggleDrawer(){ document.body.classList.toggle('drawer-open'); }
if(burger) burger.onclick = toggleDrawer;
if(overlay) overlay.onclick = closeDrawer;
const subIndex = {}; // subId -> {grp, sub}
GROUPS.forEach(g=>g.subs.forEach(s=>subIndex[s.id]={grp:g, sub:s}));

let activeSub = GROUPS[0].subs[0].id;

/* 构建两级菜单 */
GROUPS.forEach((g,gi)=>{
  const grp = document.createElement('div');
  grp.className = 'grp' + (gi===0?' open':'');
  grp.dataset.gid = g.id;
  const total = g.subs.reduce((n,s)=>n+(s.items?s.items.length:0),0);
  grp.innerHTML = `<div class="ghead"><span>${g.icon} ${g.title}</span><span class="arw">▶</span></div>
    <div class="subs">${g.subs.map(s=>{
      const cnt = s.items? `<span class="cnt">${s.items.length}</span>`:'';
      return `<a data-sid="${s.id}">${s.title}${cnt}</a>`;
    }).join('')}</div>`;
  grp.querySelector('.ghead').onclick = ()=>grp.classList.toggle('open');
  grp.querySelectorAll('.subs a').forEach(a=>{
    a.onclick = ()=>{ document.getElementById('q').value=''; show(a.dataset.sid); closeDrawer(); };
  });
  menuBox.appendChild(grp);
});

function cardHTML(it){
  const firstUrl = (it.links[0]||['',''])[1] || '#';
  const star = it.star? '<span class="star">★</span>':'';
  const links = it.links.map(l=>`<a href="${l[1]}" target="_blank" rel="noopener">${l[0]} ↗</a>`).join('');
  const nameHTML = firstUrl!=='#'
    ? `<a class="name" href="${firstUrl}" target="_blank" rel="noopener">${star}${it.name}</a>`
    : `<span class="name">${star}${it.name}</span>`;
  return `<div class="card">${nameHTML}<div class="desc">${it.desc}</div><div class="links">${links}</div></div>`;
}

function renderSpecialPath(){
  const steps = [
    {n:"Step 1", h:"看懂“大脑指挥身体”长什么样", p:"周末半天，先看 VoxPoser / Code as Policies 的 demo——免训练，靠 LLM+现成感知就能驱动机器人。目标：亲眼看到 LLM 让机器人动起来。", go:[["VoxPoser","https://voxposer.github.io"],["Code as Policies","https://code-as-policies.github.io"]]},
    {n:"Step 2", h:"用 2 篇论文吃透范式", p:"只读方法图和思路、不抠公式：SayCan=规划+可供性，ReAct=推理+行动交替。建立“大脑怎么决策”的心智模型。", go:[["SayCan","https://say-can.github.io"],["ReAct","https://react-lm.github.io"]]},
    {n:"Step 3", h:"装个仿真，把“大脑”换成你写的 LLM", p:"用 ManiSkill / Genesis 跑官方例子，把决策部分替换成你的 LLM 调用，先做抓取/摆放这类简单任务，跑通闭环。", go:[["ManiSkill","https://maniskill.ai"],["Genesis","https://github.com/Genesis-Embodied-AI/Genesis"]]},
    {n:"Step 4", h:"接 VLA 当“执行器/小脑”", p:"用 LeRobot / OpenVLA 跑一个预训练策略：LLM 负责“做什么”，VLA 负责“怎么动”。这才是真正的“大脑→动作”。", go:[["LeRobot","https://github.com/huggingface/lerobot"],["OpenVLA","https://github.com/openvla/openvla"]]},
    {n:"Step 5", h:"卡哪补哪（基础随取随用）", p:"遇到坐标系/位姿不懂→翻机器人学那一章；策略学不动→补一点模仿/强化学习。小块、按需，别一次啃完。", go:[["机器人学 CS223A","https://cs223a.stanford.edu"],["RL 速查","http://incompleteideas.net/book/the-book-2nd.html"]]},
    {n:"Step 6", h:"每周扫前沿保持手感", p:"固定刷 HF Papers + arXiv cs.RO 里 agent/planning 相关；关注 Awesome-LLM-Robotics 的更新。", go:[["HF Papers","https://huggingface.co/papers"],["arXiv cs.RO","https://arxiv.org/list/cs.RO/recent"]]},
    {n:"Step 7", h:"做个小项目收口", p:"选一个和你工作/生活相关的任务，用“LLM 大脑 + 仿真或 VLA”端到端做出来——能跑通就是最好的简历与正反馈。", go:[["Agent/大脑子类","#tech-agent"],["巡检清单","#check"]]},
  ];
  const cards = steps.map(s=>{
    const go = s.go.map(g=> g[1].startsWith('#')
      ? `<a onclick="show('${g[1].slice(1)}')">${g[0]} →</a>`
      : `<a href="${g[1]}" target="_blank" rel="noopener">${g[0]} ↗</a>`).join('');
    return `<div class="step"><span class="n">${s.n}</span><h4>${s.h}</h4><p>${s.p}</p><div class="go">${go}</div></div>`;
  }).join('');
  return `<div class="hint"><h3>⚡ 在职实操路线（从 Agent 大脑切入）</h3>
    为在职、时间碎片化的你设计：<b>从你熟悉的 LLM/Agent 入手，边做边学，基础按需补</b>，而不是先啃半年数学。
    主线是 <b>大脑 → 执行 → 卡哪补哪</b>；每步点卡片入口直达资源，周末能推进一步即可。</div>
    <div class="path">${cards}</div>`;
}

function renderSpecialCheck(){
  return `<div class="hint"><h3>✅ 日常巡检清单（省时版）</h3><ol>
    <li><b>动态</b>：机器之心 + 量子位（每天看融资/新品/论文速递）</li>
    <li><b>报告</b>：信通院 + 慧博/发现报告（搜“具身智能”“人形机器人”）</li>
    <li><b>论文</b>：Hugging Face Papers + arXiv cs.RO（每周翻一次）</li>
    <li><b>代码</b>：LeRobot / OpenVLA Releases + PwC 榜单（看新模型）</li>
    <li><b>政策</b>：中国政府网政策库 + 工信部（按季度看新文件）</li>
    <li><b>公司</b>：宇树/智元/Figure/Tesla Optimus 官网 + X 追产品进展</li>
    <li><b>参会</b>：ICRA/IROS/CoRL 投稿季 + WRC/WAIC 现场发布</li>
  </ol></div>`;
}

function show(sid){
  const node = subIndex[sid];
  if(!node) return;
  activeSub = sid;
  const {grp, sub} = node;
  // 展开所属大组
  menuBox.querySelectorAll('.grp').forEach(el=>{
    if(el.dataset.gid===grp.id) el.classList.add('open');
  });
  let body;
  if(sub.special==="path") body = renderSpecialPath();
  else if(sub.special==="check") body = renderSpecialCheck();
  else {
    const lead = sub.lead? `<div class="lead">${sub.lead}</div>`:'';
    const cnt = `<span class="cnt">${sub.items.length} 个</span>`;
    body = `<div class="sec-head"><h2>${sub.title}</h2>${cnt}<span class="tip">点击卡片标题或标签跳转</span></div>${lead}<div class="grid">${sub.items.map(cardHTML).join('')}</div>`;
  }
  content.innerHTML =
    `<div class="crumb">${grp.icon} ${grp.title} &nbsp;/&nbsp; <b>${sub.title}</b></div>`
    + body
    + `<div class="foot">本页为本地静态导航，链接指向各机构官网/栏目；具体报告常需站内检索或注册下载。共 ${GROUPS.length} 大类 / ${Object.keys(subIndex).length} 子类。</div>`;
  content.scrollTop = 0;
  menuBox.querySelectorAll('.subs a').forEach(a=>a.classList.toggle('active', a.dataset.sid===sid));
}

/* 跨全部子类搜索 */
function filter(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  if(!q){ show(activeSub); return; }
  let html = '';
  GROUPS.forEach(g=>g.subs.forEach(s=>{
    if(!s.items) return;
    const matched = s.items.filter(it=>
      (it.name+' '+it.desc+' '+it.links.map(l=>l[1]).join(' ')).toLowerCase().includes(q));
    if(!matched.length) return;
    html += `<div class="sec-head"><h2>${g.icon} ${s.title}</h2><span class="cnt">${matched.length} 命中</span></div><div class="grid" style="margin-bottom:20px">${matched.map(cardHTML).join('')}</div>`;
  }));
  content.innerHTML = `<div class="crumb">🔍 搜索：<b>${q}</b></div>` + (html || `<div class="hint">没有匹配“${q}”的信息源，换个关键词试试。</div>`);
  content.scrollTop = 0;
  menuBox.querySelectorAll('.subs a').forEach(a=>a.classList.remove('active'));
}

show(activeSub);
</script>
